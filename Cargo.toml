[package]
name = "krakenctl"
edition = "2021"
version = "0.4.0"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rusb = "0.9.4"       #for usb
image = "0.25.8"     #for editing images. Use 0.23.6 because 0.24.1 not compat with imageproc
imageproc = "0.25.0" # for editing image
ab_glyph = "0.2.31"  #for font rendering for imageproc

rand = "0.9"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
unicode-segmentation = "1.12"
gif = "0.13"
chrono = "0.4"
dirs = "6.0"
signal-hook = "0.3"                               #catch forced exits, so we can cleanup
systemstat = "0.2"                                #for getting system info
